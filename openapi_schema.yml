components:
  schemas:
    AcademicTopic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - title
      - updated_at
    AcademicTopicBlock:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeEnum'
        content: {}
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - type
      - updated_at
    AcademicTopicBlockReorderRequestRequest:
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/BlockOrderItemRequest'
          description: List of blocks with updated order values
      required:
      - blocks
    AcademicTopicBlockRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        topic_id:
          type: string
          format: uuid
          writeOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        content: {}
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - content
      - type
    AcademicTopicRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
          writeOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - chapter_id
      - title
    AcademicWantToLearn:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 300
        is_done:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - title
      - updated_at
    AcademicWantToLearnRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
          writeOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 300
        is_done:
          type: boolean
      required:
      - subject_id
      - title
    AnswerBlockOrderItemRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Answer block UUID
        order:
          type: integer
          description: New display order
      required:
      - id
      - order
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          default: true
        data:
          $ref: '#/components/schemas/AuthResponseData'
      required:
      - data
    AuthResponseData:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUserResponse'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      required:
      - tokens
      - user
    AuthUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
      required:
      - email
      - id
    BlockOrderItemRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Block UUID
        order:
          type: integer
          description: New display order
      required:
      - id
      - order
    Chapter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        order:
          type: integer
          maximum: 2147483647
