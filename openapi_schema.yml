openapi: 3.0.3
info:
  title: Notebook API
  version: 1.0.0
  description: Comprehensive REST API documentation for the Notebook application covering
    Academic records, Skills, Study Sessions, Sync, Uploads, and Analytics.
paths:
  /api/academic/chapters/:
    get:
      operationId: academic_chapters_list
      description: List chapters for subjects. Optionally filter by subject_id.
      summary: List chapters
      parameters:
      - in: query
        name: subject_id
        schema:
          type: string
        description: Filter by subject UUID
      tags:
      - Academic - Chapters
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
          description: ''
    post:
      operationId: academic_chapters_create
      description: Create a chapter under a subject.
      summary: Create chapter
      tags:
      - Academic - Chapters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChapterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChapterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
          description: ''
  /api/academic/chapters/{id}/:
    patch:
      operationId: academic_chapters_partial_update
      description: Partially update chapter name or order.
      summary: Update chapter
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Chapters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChapterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChapterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChapterRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
          description: ''
    delete:
      operationId: academic_chapters_destroy
      description: Soft delete a chapter.
      summary: Delete chapter
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Chapters
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/academic/semesters/:
    get:
      operationId: academic_semesters_list
      description: Returns all active semesters belonging to the authenticated user.
      summary: List all semesters
      tags:
      - Academic - Semesters
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Semester'
          description: ''
    post:
      operationId: academic_semesters_create
      description: Create a new semester record.
      summary: Create semester
      tags:
      - Academic - Semesters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemesterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SemesterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SemesterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
          description: ''
  /api/academic/semesters/{id}/:
    patch:
      operationId: academic_semesters_partial_update
      description: Partially update an existing semester by its UUID.
      summary: Update semester
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Semesters
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSemesterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSemesterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSemesterRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Semester'
          description: ''
    delete:
      operationId: academic_semesters_destroy
      description: Soft delete a semester by marking is_deleted=True.
      summary: Delete semester
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Semesters
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/academic/subjects/:
    get:
      operationId: academic_subjects_list
      description: List subjects belonging to the user. Optionally filter by semester_id.
      summary: List subjects
      parameters:
      - in: query
        name: semester_id
        schema:
          type: string
        description: Filter subjects by semester UUID
      tags:
      - Academic - Subjects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
          description: ''
    post:
      operationId: academic_subjects_create
      description: Create a new subject under a valid semester_id.
      summary: Create subject
      tags:
      - Academic - Subjects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubjectRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
          description: ''
  /api/academic/subjects/{id}/:
    patch:
      operationId: academic_subjects_partial_update
      description: Partially update an existing subject.
      summary: Update subject
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Subjects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSubjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSubjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSubjectRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
          description: ''
    delete:
      operationId: academic_subjects_destroy
      description: Soft delete a subject by its UUID.
      summary: Delete subject
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Subjects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/academic/topic-blocks/:
    get:
      operationId: academic_topic_blocks_list
      description: List content blocks (text, image, markdown, code, etc.) for a topic.
        Optionally filter by topic_id.
      summary: List topic blocks
      parameters:
      - in: query
        name: topic_id
        schema:
          type: string
        description: Filter by topic UUID
      tags:
      - Academic - Topic Blocks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicTopicBlock'
          description: ''
    post:
      operationId: academic_topic_blocks_create
      description: Add a new content block to an academic topic.
      summary: Create topic block
      tags:
      - Academic - Topic Blocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTopicBlockRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicTopicBlockRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicTopicBlockRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTopicBlock'
          description: ''
  /api/academic/topic-blocks/{id}/:
    patch:
      operationId: academic_topic_blocks_partial_update
      description: Partially update content or order of a topic block.
      summary: Update topic block
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Topic Blocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcademicTopicBlockRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAcademicTopicBlockRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademicTopicBlockRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTopicBlock'
          description: ''
    delete:
      operationId: academic_topic_blocks_destroy
      description: Soft delete a topic block.
      summary: Delete topic block
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Topic Blocks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/academic/topic-blocks/reorder/:
    post:
      operationId: academic_topic_blocks_reorder_create
      description: Batch update the display order of multiple blocks within a topic.
      summary: Reorder topic blocks
      tags:
      - Academic - Topic Blocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTopicBlockReorderRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicTopicBlockReorderRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicTopicBlockReorderRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/academic/topics/:
    get:
      operationId: academic_topics_list
      description: List topics under chapters. Optionally filter by chapter_id.
      summary: List academic topics
      parameters:
      - in: query
        name: chapter_id
        schema:
          type: string
        description: Filter by chapter UUID
      tags:
      - Academic - Topics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicTopic'
          description: ''
    post:
      operationId: academic_topics_create
      description: Create a new topic under a chapter.
      summary: Create academic topic
      tags:
      - Academic - Topics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTopicRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicTopicRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicTopicRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTopic'
          description: ''
  /api/academic/topics/{id}/:
    patch:
      operationId: academic_topics_partial_update
      description: Partially update topic title.
      summary: Update academic topic
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Topics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcademicTopicRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAcademicTopicRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademicTopicRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTopic'
          description: ''
    delete:
      operationId: academic_topics_destroy
      description: Soft delete an academic topic.
      summary: Delete academic topic
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Topics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/academic/want-to-learn/:
    get:
      operationId: academic_want_to_learn_list
      description: List wish-list topics to learn for subjects. Optionally filter
        by subject_id.
      summary: List academic want-to-learn items
      parameters:
      - in: query
        name: subject_id
        schema:
          type: string
        description: Filter by subject UUID
      tags:
      - Academic - Want to Learn
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicWantToLearn'
          description: ''
    post:
      operationId: academic_want_to_learn_create
      description: Create a new topic wishlist item under a subject.
      summary: Create academic want-to-learn item
      tags:
      - Academic - Want to Learn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicWantToLearnRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicWantToLearnRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicWantToLearnRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicWantToLearn'
          description: ''
  /api/academic/want-to-learn/{id}/:
    patch:
      operationId: academic_want_to_learn_partial_update
      description: Partially update status (is_done) or title of a want-to-learn item.
      summary: Update academic want-to-learn item
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Want to Learn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAcademicWantToLearnRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAcademicWantToLearnRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAcademicWantToLearnRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicWantToLearn'
          description: ''
    delete:
      operationId: academic_want_to_learn_destroy
      description: Soft delete a want-to-learn item.
      summary: Delete academic want-to-learn item
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academic - Want to Learn
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/analytics/overview/:
    get:
      operationId: analytics_overview_retrieve
      description: Academic vs Skill study time breakdown, daily timeline, and top
        5 topics for daily, weekly, monthly, or yearly periods.
      summary: Overview study analytics
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: Reference date formatted as YYYY-MM-DD (defaults to today)
      - in: query
        name: period
        schema:
          type: string
          enum:
          - daily
          - monthly
          - weekly
          - yearly
          default: weekly
        description: Analytics time period
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewAnalyticsResponse'
          description: ''
  /api/analytics/skill/:
    get:
      operationId: analytics_skill_retrieve
      description: Returns total seconds studied across all sub-skills under a parent
        skill.
      summary: Skill total study time
      parameters:
      - in: query
        name: skill_id
        schema:
          type: string
        description: UUID of the skill
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillTimeResponse'
          description: ''
  /api/analytics/sub-skill/:
    get:
      operationId: analytics_sub_skill_retrieve
      description: Returns total seconds studied for all topics belonging to a sub-skill.
      summary: Sub-skill total study time
      parameters:
      - in: query
        name: sub_skill_id
        schema:
          type: string
        description: UUID of the sub-skill
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubSkillTimeResponse'
          description: ''
  /api/analytics/topic/:
    get:
      operationId: analytics_topic_retrieve
      description: Returns total seconds studied for a specific academic or skill
        topic.
      summary: Topic total study time
      parameters:
      - in: query
        name: topic_id
        schema:
          type: string
        description: UUID of the topic
        required: true
      - in: query
        name: topic_type
        schema:
          type: string
          enum:
          - academic
          - skill
        description: Type of topic
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicTimeResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate with email and password to receive JWT access and
        refresh tokens.
      summary: Login user
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve the ID and email of the currently authenticated user.
      summary: Current user info
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Register a new account with email and password. Returns user details
        and JWT access/refresh tokens.
      summary: Register new user
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/sessions/{id}/:
    patch:
      operationId: sessions_partial_update
      description: Update duration seconds and/or mark a study session as completed.
      summary: Update or end session
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Study Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSessionUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSessionUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSessionUpdateRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicSessionResponse'
          description: ''
  /api/sessions/active/:
    get:
      operationId: sessions_active_retrieve
      description: Returns the currently active (not completed) session, or null if
        no session is running.
      summary: Get active session
      tags:
      - Study Sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicSessionResponse'
          description: ''
  /api/sessions/start/:
    post:
      operationId: sessions_start_create
      description: Start a new study session for an academic or skill topic (stopwatch
        or timer mode).
      summary: Start new session
      tags:
      - Study Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionStartRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionStartRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionStartRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicSessionResponse'
          description: ''
  /api/skills/:
    get:
      operationId: skills_list
      description: Returns all active skills belonging to the authenticated user.
      summary: List skills
      tags:
      - Skills
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
          description: ''
    post:
      operationId: skills_create
      description: Create a new skill category.
      summary: Create skill
      tags:
      - Skills
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillRequest'
